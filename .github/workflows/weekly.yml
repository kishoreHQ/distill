name: weekly

on:
  schedule:
    # Sunday 23:30 UTC, same clock time as the daily job.
    - cron: "30 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Weekly review from repo data
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/generate_weekly_review.py --date "$(date -u +%F)"
      - name: Commit results
        run: |
          git config user.name "distill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/weekly
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly review $(date -u +%F)"
            git push
          fi
