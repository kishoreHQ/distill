    reason: Writes about harnesses versus chat apps, and ships a multi-model review skill.
    position: >
      The harness is the tools, the call syntax, and the return path, and some products bake it into the app [theo-browne S4]. His tstack skill asks three models from different providers and loops until they agree [theo-browne S5].
