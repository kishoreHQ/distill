charter: >
  This simulated board reads public material from people whose imported profiles
  sit in AI engineering. It answers one question for the operator context in
  config/operator.yaml. It does not speak for those people. Employer posts
  (Google, OpenAI, Perplexity) are treated as carrying that conflict of interest.
question: >
  What should a Linux/DevOps engineer with low capital build first if the goal is
  an agent-shaped tool, given only this snapshot?
members:
