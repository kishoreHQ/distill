    reason: High-confidence profile, board_eligibility includes ai-engineering, and the transcript states a grounding rule.
    position: >
      Say only what you retrieved [aravind-srinivas S7]. Score a fetched page before an agent trusts it [aravind-srinivas S16]. For a high-stakes answer, let several models work and have a chair model synthesize [aravind-srinivas S17].
    evidence:
      - source: S7
        url: https://lexfridman.com/aravind-srinivas-transcript/
