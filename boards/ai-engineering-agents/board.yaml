disagreements:
  - "Saboo's public setup is seven agents, ten cron jobs, and zero employees [shubham-saboo S6]. Steinberger's gate is narrower: vision, inferable, clear fix, live test [peter-steinberger S8]. The snapshot does not show these as the same operating rule."
  - "Wrigley's unread-approve joke [mckay-wrigley S17] cuts against Theo's multi-model review loop [theo-browne S5] and against Steinberger's test requirement [peter-steinberger S8]."
  - "Srinivas's grounding rule [aravind-srinivas S7] limits what an agent may say. A cron job that posts or emails without that limit, which is closer to the Saboo and Levels patterns elsewhere in the corpus, does not satisfy it."
synthesis: >
  The overlapping public advice is to keep the harness explicit, ground claims in retrieved notes, and put a test or a second model in front of an autonomous edit. It is not to staff a company with unattended agents, and it is not to compete with a lab on a general assistant. For this operator, the smallest build that uses the overlap is a cited runbook helper with a human gate on any change to a repo.
recommended_next_action: >
  Write a one-page spec for a helper that answers only from a folder of runbooks and refuses when the folder does not contain the answer. Add a checklist that treats fetched pages as untrusted. Do not start a general chatbot, and do not quote Perplexity's revenue.
