  - profile_id: peter-steinberger
    reason: First-party posts on CLI-first agent work and a four-check gate before autonomous edits.
    position: >
      Start with the model and a CLI [peter-steinberger S5]. Let an agent work an issue only when it fits the repo's stated vision, is inferable, has a clear fix, and can be tested live [peter-steinberger S8]. He also calls "vibe coding" a slur [peter-steinberger S15]. He is an OpenAI employee in this snapshot.
