disagreements:
  - "Mishra teaches Kubernetes as a production skill and sells that teaching [akhilesh-mishra S2]. Gupta says he avoids Kubernetes orchestration talk [arnav-gupta B-2]. Both statements are public. A DevOps engineer can know clusters and still not put Kubernetes in a product that does not need it."
  - "Belagatti's 'DevOps is dead' [pavan-belagatti S6] is a slogan, and his 2026-11-24 sentence says DevOps is not dead [pavan-belagatti S19]. Mishra's 'DevOps is not a tool list' [akhilesh-mishra S5] keeps the practice and drops the logo list."
  - "Suman's talk is for people who already run large clusters [suman-chakraborty S2]. It is not evidence that a first product should be a Kubernetes distribution."
synthesis: >
  The supported offer is operational and narrow. Take a team that already has tickets and a cluster or a bill, and sell a gated agent path plus an identity story that is not a shared API key. Do not sell a bootcamp, do not quote Mishra's rupee prices as a market rate, and do not quote placement statistics. Gupta's monolith quote is a constraint on the product's own architecture, not a heckle aimed at every client who already runs Kubernetes. Mishra's newer line says not to let the job be a bridge from Jira to Claude [akhilesh-mishra S17]. The pilot is the trade-off and the gate, not ticket forwarding.
recommended_next_action: >
  Draft a one-repository pilot. The written rules are an approval before merge, a credential that is not a shared bearer token, and a runbook for how the agent is turned off. Offer it as a scoped conversation to one team. Leave cohort prices and MRR figures out of the page.
