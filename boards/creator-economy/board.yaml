  - profile_id: harkirat-singh
    reason: Education business with public cohort notes, and a later line that syntax matters less than specs. Placement numbers in the bundle are self-reported.
    position: >
      He posts "Keep documenting and writing specs in your codebase" and doubts a need to learn syntax, while noting interviews may still ask for it [harkirat-singh S5]. A 2025 post says it is easier to place someone skilled at 12 LPA than someone unskilled at 3 LPA [harkirat-singh S13]. The 100xDevs page is his school [harkirat-singh S19]. Placement counts in the YouTube ledger entry are self-reported.
