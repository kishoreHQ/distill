disclaimer: "SIMULATED ADVISORY BOARD. The real people named here have not joined this board, have not been contacted, and have not endorsed DISTILL, Kishore, or any recommendation in this file. Positions below are paraphrases of their public posts and pages, with citations. They are not quotes of private advice."
charter: >
  This simulated board is about distribution and teaching in public. It seats
  people with first-party posts on that work. It does not seat sponsored-post
  accounts as advisors. Nav Toor's profile is a format case study in the batch
  summary and is cited only as a conflict-of-interest example, not as a member.
question: >
  How should time be split between distribution and building, and which public
  tactics are also sales funnels?
members:
  - profile_id: dan-koe
    reason: First-party argument that checklist content is copyable, and that marketing is most of the work. He sells guides.
    position: >
      If the strategy can be written as steps, an AI avatar can copy it [dan-koe S3]. He also posts that marketing is 80% of a creative's success [dan-koe S9], and that proof of work replaces the resume [dan-koe S11]. The profile says he sells guides and promotes Eden, with ownership of Eden not verified.
    evidence:
      - source: S3
        url: https://thedankoe.com/letters/you-dont-need-a-niche-you-need-a-point-of-view/
      - source: S9
        url: https://x.com/thedankoe/status/2111083500430295493
      - source: S11
        url: https://x.com/thedankoe/status/2090759574370332981
  - profile_id: david-ondrej
    reason: A transcript line gives a numeric split, and he sells a community.
    position: >
      "At least 50% of your time should be on distribution." [david-ondrej S6]. The same profile shows a paid Skool and a falling third-party member count [david-ondrej S5]. The distribution line can be true and still be a funnel.
    evidence:
      - source: S6
        url: https://rosetta.to/u/davidondrej/making-with-ai-saas-i-might-delete-this
