        url: https://x.com/AlexFinn
  - profile_id: akshay-saini
    reason: Large teaching audience in the ledger, and posts about how engineers should use AI. NamasteDev is his organization in the front matter.
    position: >
      He says engineers will have to delegate earlier, including stating what "done" means [akshay-saini S2]. He says asking what percent of a project the AI wrote is a bad interview question [akshay-saini S5]. He teaches. A learning path he praises can also feed the school. No course price was copied into this deliberation.
