disagreements:
  - "Tw93's paid surface is a native desktop app [tw93 S7]. Ondrej's Cloudroom runs harnesses in the cloud [david-ondrej S2]. Steinberger's Apple-agreement post shows a desktop release can stop for a reason that has nothing to do with the code [peter-steinberger S20]."
  - "Dörr prefers faster, lower-effort reasoning [tom-dorr S6]. Theo's review skill waits until three models agree [theo-browne S5]. Both are in the snapshot. They are not the same quality bar."
synthesis: >
  A free CLI is the piece these notes actually support as a starting shape. A paid desktop app is one documented path, Tw93's, and it comes with hand support and with platform risk. A cloud runner is a different product. The quality bar that shows up more than once is an executable check, not a prompt. Star counts and the self-reported ARR line are not the decision. On 2026-11-25 the extra constraint is to list what telemetry you actually keep [tw93 S18] [theo-browne S24], and to assume a platform can forbid the CLI [peter-steinberger S23]. An agent that never refuses [david-ondrej S16] is not the quality bar. A sandbox per agent [david-ondrej S18] is a stronger isolation claim and still his product. Tw93's Black Friday post repeats $15.20 and keeps the Mac CLI free [tw93 S20] [tw93 S23]. That does not raise the price into a forecast. HarnessRouter [tom-dorr S19] is a link in a feed, not a second quality bar. On 2026-11-28 Tw93's 8折 line [tw93 S25] does not change the dollar price into a forecast. Ix [tom-dorr S21] and Council of High Intelligence [tom-dorr S22] are more links. Ondrej's refusal line [david-ondrej S20] does not withdraw the never-says-no ad.
recommended_next_action: >
  Pick one command-line pain from the operator's own week. Ship it as a free CLI. Answer the first users by hand. Do not automate support, and do not sell a GUI, until the same question has come back with a stable answer. Do not cite Tw93's refund rate as an expectation.
