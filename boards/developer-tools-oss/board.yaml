charter: >
  This simulated board looks at public notes on CLIs, open source, and agent
  devtools. Star counts in the ledger are not revenue. Pseudonymous and
  aggregator accounts are not seated.
question: >
  Is a free CLI plus a paid desktop app a fit for a DevOps-shaped tool, and what
  quality bar do these builders actually describe?
members:
  - profile_id: tw93
    reason: First-party account of Mole and Pake. The free CLI / paid app split is in his own words.
    position: >
      The Pake launch post says the open-source CLI stays free and the native app is one purchase [tw93 S7]. The Mole essay, in the ledger's description, says he did support by hand first [tw93 S4]. The Chinese excerpt at [tw93 S3] says not to trust a prompt alone for a rule the agent must obey. On 2026-11-24 he says Mole now cleans leftover AI-tool state [tw93 S15], and he says he wants a no-AI editor for reading code and diffs [tw93 S16]. On 2026-11-25 he posts a $15.20 sale through December 1 [tw93 S17] and says his products add no telemetry beyond activation binding [tw93 S18]. The GUI, he says, has features the CLI does not [tw93 S19]. On 2026-11-26 the same $15.20 is a Black Friday price for Mac and Windows, with a 14-day refund he states [tw93 S20]. He says the Mac open-source build stays free [tw93 S23] and that Mole is not a CleanMyMac substitute [tw93 S22]. A three-device plan around $29 is a plan [tw93 S24]. The prices are his. On 2026-11-28 he says an 8折 discount is a psychological burden because of people who paid the normal price, and that he does not like marketing Mole [tw93 S25]. The 8折 is his. It is not a new dollar price.
