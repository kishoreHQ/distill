disagreements:
  - "Levels' bio in the ledger lists large monthly revenue figures, and the same corpus contains his 4-out-of-70 hit rate [pieter-levels S8]. Using only the bio would hide the misses."
  - "Finn's bio states $300k ARR [alex-finn S1]. Piyush's evidenced line is $694 MRR at day 104 [piyush-sachdeva S1]. These are different kinds of self-report. Neither is a quota."
  - "Levels blocks automated AI replies [pieter-levels S14]. A reply-cadence copied from Finn [alex-finn S6] and then handed to a bot would conflict with that post."
synthesis: >
  The evidenced first motion is a small, manual offer with a public number the builder is willing to show, after a channel has been worked by hand. Levels' hit rate says most projects do not pay. Piyush's day-104 line is a concrete small number and a platform warning. Finn's ARR and Levels' monthly figures are not the planning numbers for a first month. Levels' 2026-11-25 honeypots [pieter-levels S21] are a reason not to automate replies. His OS-takeover line [pieter-levels S24] is the same niche warning as before, in sharper words. Piyush's 25% sale [piyush-sachdeva S21] is not a new traction number. His 2026-11-26 approval post [piyush-sachdeva S22] is a platform gate opening in his words, still without a new MRR. Levels' false-positive count [pieter-levels S26] is a reason the blocklist is not an audit. Vatsal's deepen pass returned no older posts. He stays partial. On 2026-11-28 Levels restates the handoff and adds data and lists [pieter-levels S31], still with no receipt. Piyush says the price stays the same [piyush-sachdeva S23]. No new MRR. Vatsal's behaviour line [vatsal-sanghvi S12] does not promote him.
recommended_next_action: >
  Run one manual offer for two weeks. An infra-bill review for a team the operator already knows is the offer that matches the DevOps context. Log ten conversations before any agent sends a reply or an invoice. Do not publish a revenue target taken from this corpus.
