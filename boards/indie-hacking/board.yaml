charter: >
  This simulated board uses public, mostly self-reported product notes. Dollar
  figures stay attached to the person who posted them. The question is what
  experiment shape is actually evidenced, not what income to expect.
question: >
  What is a realistic first revenue motion for a low-capital builder, using only
  the self-reported cases in this snapshot?
