id: agentic-devops-pipeline
title: Issue-to-PR pipeline with a human gate and owner-attributable identity
as_of: "2026-11-27"
status: hypothesis
disclaimer: "Opportunity scores are hypotheses with links to public evidence. They are not income projections, job offers, or proof that a business exists. Self-reported revenue in the sources belongs to those authors, not to Kishore."
hypothesis: >
  Help a team that already has GitHub issues wire a coding agent that opens a pull request only when
  a written rule passes, and that does not authenticate as a shared bearer token. Pavan Belagatti
  published an issue-to-PR factory. Mukul Lohar argued for owner-attributable agent identity.
  Peter Steinberger published a four-check autotriage rule. Theo's tstack README describes multi-model
  review. Together they describe a service shape. They do not describe a signed customer.
domains: [careers-cloud-devops, ai-engineering-agents]
dimensions:
  market_pull:
    score: 6
    note: Several builders published the pattern. The corpus does not show a queue of teams paying for it.
  evidence_strength:
    score: 8
    note: Four baseline sources, plus Suman's pager question, Saboo's human-in-the-loop note, Mishra's 2026-11-25 warning not to be only a Jira-to-Claude bridge, Mischa's per-project container credentials, and Pavan's 2026-11-26 curve that ends at guardrails and evaluations. They agree with a human gate. They are still single posts, so the score stays 8. None of this is a case study of Kishore's offer.
  fit_with_kishore_skills:
    score: 9
    note: CI, pull requests, credentials, and approval gates sit on the spec's DevOps skills.
  time_to_value:
    score: 6
    note: A pilot on one repository is smaller than a platform. The sources do not give a build time.
  competition_gap:
    score: 3
    note: GitHub, the labs, and several people in this corpus already ship pieces of this. On 2026-11-25 Saboo credits a harness change for a usage jump, Finn shows a seven-agent swarm, and an aggregator post describes a CLI that fixes a failed CI run. The gap is thinner than it was yesterday. The score drops from 4 to 3.
  monetization_clarity:
    score: 6
    note: A fixed pilot invoice is understandable. No source here shows that invoice being paid.
  risk_inverse:
    score: 5
    note: The identity and human-gate points are still the risk controls. Steinberger's 2026-11-25 post says a platform can forbid the agent CLI unless you pay more, and Theo's telemetry posts the same day do not agree with each other. That is extra platform and trust risk, so the score drops from 6 to 5. An unbounded agent with production credentials remains the failure mode.
evidence:
  - profile: pavan-belagatti
    source: S2
    url: https://x.com/Pavan_Belagatti/status/2113152830815297694
    note: Ledger describes a GitHub issue to Codex to PR path with human review.
  - profile: mukul-lohar
    source: S2
    url: https://x.com/ironfisto/status/2117668653684629608
    note: Excerpt says most agents still prove identity with a bearer token.
  - profile: peter-steinberger
    source: S8
    url: https://x.com/steipete/status/2058240758801420530
    note: Autotriage reads VISION.md and acts when the change is inferable, has a clear fix, and can be tested live.
  - profile: theo-browne
    source: S5
    url: https://github.com/t3dotgg/tstack
    note: Ledger excerpt says a skill gets review from three models and loops until they agree.
  - profile: suman-chakraborty
    source: S10
    url: https://x.com/itsmesumanc/status/2125179626670711003
    note: He asks who is paged if an agent can write, review, and click Approve.
  - profile: shubham-saboo
    source: S14
    url: https://x.com/Saboo_Shubham_/status/2125298072188231810
    note: Employer post. Workspace MCP GA includes a human-in-the-loop control.
  - profile: akhilesh-mishra
    source: S17
    url: https://x.com/livingdevops/status/2125475523384254782
    note: He says not to let a DevOps job be only a bridge between Jira and Claude.
  - profile: mischa-van-den-burg
    source: S16
    url: https://x.com/mischavdburg/status/2125485325027782841
    note: Per-project rootless container and its own credentials. His practice, truncated.
  - profile: peter-steinberger
    source: S23
    url: https://x.com/steipete/status/2125654555262431248
    note: He says Google is forbidding CLIs like gog unless you pay more. Platform risk. The terms page was not fetched.
  - profile: pavan-belagatti
    source: S22
    url: https://x.com/Pavan_Belagatti/status/2125992897514488079
    note: He places specifications, guardrails, and evaluations after prompts and context. A learning-curve post, not a paid pilot.
risks:
  - Pavan's article is also his public advocacy. Treat it as a design note, not as demand.
  - Steinberger is an OpenAI employee in this snapshot. His model comparisons carry that conflict of interest, as his own profile records.
non_claims:
  - Not a claim of a signed pipeline customer.
  - Not a claim that these four people agreed with each other or with this offer.
